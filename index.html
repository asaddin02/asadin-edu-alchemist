<!doctype html>
<html lang="id" data-level="sma" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://pubchem.ncbi.nlm.nih.gov https://upload.wikimedia.org; connect-src 'self' https://pubchem.ncbi.nlm.nih.gov; font-src 'self' https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self';"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#070a13" />
    <meta name="color-scheme" content="dark light" />
    
    <title>ChemTaxa · Atlas Molekul & Pembelajaran Kimia Semesta</title>
    <meta
      name="description"
      content="ChemTaxa: atlas struktur molekul terbuka dan platform laboratorium virtual kimia untuk SD, SMP, SMA, mahasiswa, dan pengajar. Diberdayakan oleh basis data resmi PubChem NIH."
    />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChemTaxa · Asadin Edu" />
    <meta property="og:title" content="ChemTaxa · Atlas Molekul & Kimia Semesta" />
    <meta
      property="og:description"
      content="Jelajahi geometri molekul 3D, ikatan atom, dan laboratorium virtual interaktif dari SD sampai Kuliah."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/mark.svg" />

    <!-- CSS Design System -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layouts.css" />

    <link rel="modulepreload" href="js/app.js" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Lewati ke konten utama / Skip to main content</a>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <header id="header"></header>
    
    <main id="main" tabindex="-1">
      <div class="status-loading">
        <div class="orbital-spinner" aria-hidden="true">
          <div class="orbit"></div>
          <div class="orbit-2"></div>
          <div class="nucleus"></div>
        </div>
        <p class="loading-text">Memuat materi ChemTaxa…</p>
      </div>
      <noscript>
        <div class="container" style="padding: 40px 20px; text-align: center;">
          <h2>JavaScript Diperlukan</h2>
          <p>ChemTaxa membutuhkan JavaScript untuk merender struktur molekul 3D dan mengambil data dari PubChem NIH.</p>
        </div>
      </noscript>
    </main>

    <footer id="footer"></footer>
    <div id="toast" class="toast-container" role="status" aria-live="polite"></div>
  </body>
</html>
