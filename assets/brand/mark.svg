<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="#070a13" stroke="url(#cyanGrad)" stroke-width="2.5" />

  <!-- Orbital Rings -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" transform="rotate(30 64 64)" opacity="0.8" />
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" transform="rotate(90 64 64)" opacity="0.8" />
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" transform="rotate(150 64 64)" opacity="0.8" />

  <!-- Central Nucleus -->
  <circle cx="64" cy="64" r="14" fill="url(#cyanGrad)" filter="url(#glow)" />
  <circle cx="64" cy="64" r="7" fill="#ffffff" />

  <!-- Orbiting Electrons -->
  <circle cx="104" cy="41" r="4.5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="64" cy="18" r="4.5" fill="#ec4899" filter="url(#glow)" />
  <circle cx="24" cy="87" r="4.5" fill="#38bdf8" filter="url(#glow)" />
</svg>
